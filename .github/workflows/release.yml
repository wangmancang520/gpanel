name: Release

# Push a tag like v0.2.0 to publish a release. install.sh installs and
# updates from the latest release, verifying files against SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go vet ./... && go test ./...
      - name: build
        run: |
          set -eu
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/gpanel-$os-$arch$ext" ./cmd/gpanel
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: binary reports the tag
        run: test "$(dist/gpanel-linux-amd64 -version)" = "$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "GPanel $GITHUB_REF_NAME" --generate-notes --verify-tag
